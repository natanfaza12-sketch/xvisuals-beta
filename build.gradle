plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

def payloadZip = layout.projectDirectory.file('payload.zip')
def payloadDir = layout.buildDirectory.dir('payload')

if (!payloadZip.asFile.exists()) {
    throw new GradleException("Missing payload.zip in project root: ${payloadZip.asFile}")
}

/*
 * Expected ZIP layout:
 * payload/src/main/java/...
 * payload/src/main/resources/...
 */
def payloadJavaDir = payloadDir.map { it.dir('payload/src/main/java') }
def payloadResourcesDir = payloadDir.map { it.dir('payload/src/main/resources') }

tasks.register('extractPayload', Sync) {
    from(zipTree(payloadZip))
    into(payloadDir)
}

sourceSets {
    main {
        java.srcDir(payloadJavaDir)
        resources.srcDir(payloadResourcesDir)
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

tasks.named('compileJava') {
    dependsOn(tasks.named('extractPayload'))
    doFirst {
        def javaDir = payloadJavaDir.get().asFile
        def javaFiles = fileTree(javaDir).matching { include '**/*.java' }.files
        if (javaFiles.isEmpty()) {
            throw new GradleException("No Java source files found in ${javaDir}. Check the internal structure of payload.zip.")
        }
        logger.lifecycle("Compiling ${javaFiles.size()} Java source files from ${javaDir}")
    }
}

tasks.named('processResources') {
    dependsOn(tasks.named('extractPayload'))
    inputs.property('version', project.version)

    filesMatching('fabric.mod.json') {
        expand(version: project.version)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

/*
 * Register this dependency only AFTER withSourcesJar() has created sourcesJar.
 */
tasks.named('sourcesJar') {
    dependsOn(tasks.named('extractPayload'))
}

jar {
    from('LICENSE-ALATIC-MIT') {
        into 'META-INF/licenses'
    }
    from('THIRD-PARTY-NOTICES.md') {
        into 'META-INF'
    }
}
