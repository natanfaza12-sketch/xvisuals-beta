plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Rozpakowanie payload.zip w czasie konfiguracji (zip ma src/main/java i src/main/resources w korzeniu)
def payloadZipFile = file('payload.zip')
if (!payloadZipFile.exists()) {
    throw new GradleException("Brak payload.zip w glownym folderze repo")
}
def payloadOut = new File(buildDir, 'payload')
delete(payloadOut)
ant.unzip(src: payloadZipFile, dest: payloadOut)

sourceSets {
    main {
        java.srcDir(new File(payloadOut, 'src/main/java'))
        resources.srcDir(new File(payloadOut, 'src/main/resources'))
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property('version', project.version)
    filesMatching('fabric.mod.json') {
        expand(version: project.version)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE-ALATIC-MIT') { into 'META-INF/licenses' }
    from('THIRD-PARTY-NOTICES.md') { into 'META-INF' }
}
